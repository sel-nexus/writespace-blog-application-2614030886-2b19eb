server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed bundle failures must not masquerade as successful SPA responses.
    location /assets/ {
        try_files $uri =404;
    }
    location = /favicon.svg {
        try_files $uri =404;
    }
    # Browser routes are resolved in React, including unknown local routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
